services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: "123"
            POSTGRES_DB: test
        ports:
            - "32054:5432"
        tmpfs:
            - /var/lib/postgresql/data

    minio:
        image: minio/minio:latest
        entrypoint: sh
        command: -c 'mkdir -p /export/feridinha-dev && /usr/bin/minio server /export'
        environment:
            MINIO_ROOT_USER: user
            MINIO_ROOT_PASSWORD: 12345678feridinha
        ports:
            - "9000:9000"
            - "9001:9001"

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
