[test]
coverageSkipTestFiles = true
coverageThreshold = { lines = 1.0, functions = 1.0, statements = 1.0 }
coveragePathIgnorePatterns = [
    "tests/**",
    "src/app.ts",
    "src/config/**",
    "src/index.ts",
    "src/services/database.ts",
    "src/handlers/preview.ts",
    "src/migrators/**",
    "src/test.ts",
]
